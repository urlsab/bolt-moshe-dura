  // Robust - Assistive Tech
  screenReaderMode: boolean;

import React, { useEffect, useRef, useState } from 'react';

type FontSize = 'normal' | 'large' | 'xlarge';

interface Settings {
  highContrast: boolean;
  fontSize: FontSize;
  reduceMotion: boolean;
  dyslexiaFont: boolean;
  toolbarOpen: boolean;
  ttsEnabled: boolean;
}

const STORAGE_KEY = 'a11y-settings';
const defaultSettings: Settings = {
  highContrast: false,
  fontSize: 'normal',
  reduceMotion: false,
  dyslexiaFont: false,
  toolbarOpen: false,
  ttsEnabled: false,
};

export default function AccessibilityOverlay(): JSX.Element {
  const [settings, setSettings] = useState<Settings>(defaultSettings);
  const panelRef = useRef<HTMLDivElement | null>(null);
  const openerRef = useRef<HTMLButtonElement | null>(null);
  const liveRef = useRef<HTMLDivElement | null>(null);

  useEffect(() => {
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) setSettings({ ...defaultSettings, ...JSON.parse(stored) });
    } catch {}
  }, []);

  useEffect(() => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
  }, [settings]);

  useEffect(() => {
    const body = document.body;
    body.setAttribute('data-contrast', String(settings.highContrast));
    body.setAttribute('data-font-size', settings.fontSize);
    body.setAttribute('data-reduce-motion', String(settings.reduceMotion));
    body.setAttribute('data-dyslexia', String(settings.dyslexiaFont));
  }, [settings]);

  useEffect(() => {
    document.documentElement.lang = 'he';
  }, []);

  // קריאת טקסט בקול
  const speak = (text: string) => {
    if (!settings.ttsEnabled) return;
    if (!window.speechSynthesis) {
      alert('דפדפן זה אינו תומך בקריאת טקסט בקול.');
      return;
    }
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'he-IL';
    window.speechSynthesis.speak(utterance);
  };

  const handleReadPage = () => {
    const content = document.body.innerText;
    speak(content);
  };

  const stopReading = () => {
    window.speechSynthesis.cancel();
  };

  useEffect(() => {
    const handler = (e: KeyboardEvent) => {
      if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 'a') {
        e.preventDefault();
        setSettings(s => ({ ...s, toolbarOpen: !s.toolbarOpen }));
      }
      if (e.key === 'Escape') {
        setSettings(s => ({ ...s, toolbarOpen: false }));
        openerRef.current?.focus();
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);

  const toggle = (key: keyof Settings) =>
    setSettings(s => ({ ...s, [key]: !s[key] }));
  const setFont = (f: FontSize) => setSettings(s => ({ ...s, fontSize: f }));
  const reset = () => {
    stopReading();
    setSettings(defaultSettings);
  };

  const stopAnimations = () => {
    if (document.getElementById('stop-animations-style')) return;
    const style = document.createElement('style');
    style.id = 'stop-animations-style';
    style.innerHTML = `
      * {
        animation: none !important;
        transition: none !important;
      }
      video, audio {
        animation-play-state: paused !important;
        transition: none !important;
      }
    `;
    document.head.appendChild(style);
  };

  return (
    <>
      <a
        href="#main"
        className="sr-only focus:not-sr-only p-2 m-2 border rounded bg-white text-black z-50"
      >
        קפוץ לתוכן הראשי
      </a>

      <div
        ref={liveRef}
        aria-live="polite"
        style={{ position: 'absolute', left: -9999 }}
      />

      <div className="fixed bottom-4 right-4 z-50">
        <button
          ref={openerRef}
          aria-expanded={settings.toolbarOpen}
          aria-controls="a11y-panel"
          onClick={() =>
            setSettings(s => ({ ...s, toolbarOpen: !s.toolbarOpen }))
          }
          className="p-3 bg-white rounded-full shadow focus:ring-2"
        >
          ♿
        </button>

        {settings.toolbarOpen && (
          <div
            ref={panelRef}
            id="a11y-panel"
            role="dialog"
            aria-label="סרגל נגישות"
            className="mt-2 p-4 w-80 rounded-2xl bg-white shadow-lg text-black"
          >
            <h2 className="text-base font-semibold mb-3">כלי נגישות</h2>

            <div className="space-y-3">
              <button
                onClick={() => toggle('highContrast')}
                aria-pressed={settings.highContrast}
                className="block w-full text-left border rounded p-2 focus:ring-2"
              >
                ניגודיות גבוהה {settings.highContrast ? '✓' : ''}
              </button>

              <div>
                <label className="block mb-1 text-sm">גודל טקסט:</label>
                <div className="flex gap-2">
                  {(['normal', 'large', 'xlarge'] as FontSize[]).map(f => (
                    <button
                      key={f}
                      onClick={() => setFont(f)}
                      className={`px-2 py-1 border rounded focus:ring-2 ${
                        settings.fontSize === f ? 'bg-gray-200' : ''
                      }`}
                    >
                      {f === 'normal'
                        ? 'רגיל'
                        : f === 'large'
                        ? 'גדול'
                        : 'מאוד'}
                    </button>
                  ))}
                </div>
              </div>

              <button
                onClick={() => toggle('reduceMotion')}
                aria-pressed={settings.reduceMotion}
                className="block w-full text-left border rounded p-2 focus:ring-2"
              >
                הפחת תנועה {settings.reduceMotion ? '✓' : ''}
              </button>

              <button
                onClick={() => toggle('dyslexiaFont')}
                aria-pressed={settings.dyslexiaFont}
                className="block w-full text-left border rounded p-2 focus:ring-2"
              >
                גופן לדיסלקציה {settings.dyslexiaFont ? '✓' : ''}
              </button>

              <button
                onClick={() => toggle('ttsEnabled')}
                aria-pressed={settings.ttsEnabled}
                className="block w-full text-left border rounded p-2 focus:ring-2"
              >
                קריאת טקסט בקול {settings.ttsEnabled ? '✓' : ''}
              </button>

              {settings.ttsEnabled && (
                <div className="flex gap-2">
                  <button
                    onClick={handleReadPage}
                    className="w-1/2 border rounded p-2 focus:ring-2"
                  >
                    קרא דף
                  </button>
                  <button
                    onClick={stopReading}
                    className="w-1/2 border rounded p-2 focus:ring-2"
                  >
                    עצור
                  </button>
                </div>
              )}

              <button
                onClick={stopAnimations}
                className="block w-full text-left border rounded p-2 focus:ring-2"
              >
                עצור אנימציות
              </button>

              <button
                onClick={() =>
                  window.scrollTo({ top: 0, behavior: 'smooth' })
                }
                className="block w-full text-left border rounded p-2 focus:ring-2"
              >
                ↑ חזור לראש הדף
              </button>

              <button
                onClick={reset}
                className="block w-full text-left border rounded p-2 focus:ring-2"
              >
                אפס הכל
              </button>

              <p
                role="note"
                className="text-xs text-gray-600 border-t pt-2 mt-2"
              >
                קיצורי מקשים: Ctrl+Alt+A לפתיחה, Escape לסגירה.
              </p>
            </div>
          </div>
        )}
      </div>
    </>
  );
}
